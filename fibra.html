let cableColor='#eab308';function msg(t){notice=t;$('status').textContent=t}function has(a,b){return s.links.some(l=>l.a===a&&l.b===b||l.a===b&&l.b===a)}function pick(id){let p=ports[id];if(!p)return;if(mode==='pose'){if(p.idx!==s.route+1){msg('Seleziona il prossimo punto del percorso.');return}if(s.route===s.block&&!s.cleared){msg('Sonda bloccata. Verifica il tratto e ripristina il percorso simulato.');return}s.route++;msg('Sonda avanzata fino a '+p.label+'.');render();return}if(mode==='pfs'&&p.occupied){msg(p.label+' · permuta preesistente (simulata, protetta).');return}if(tool==='probe'){let connected=s.links.find(l=>l.a===id||l.b===id);msg(p.label+' · '+(connected?(mode==='pfs'?'-14.9 dBm (stima didattica)':'Continuità rilevata (simulata)'):'Nessun collegamento / LOS'));return}if(tool==='remove'){let n=s.links.length;s.links=s.links.filter(l=>l.a!==id&&l.b!==id);if(mode==='home')s.reg=false;selected=null;msg(n===s.links.length?'Nessun cavo da rimuovere.':'Collegamento rimosso.');render();return}if(selected===id){selected=null;msg('Selezione annullata.');render();return}if(s.links.some(l=>l.a===id||l.b===id)){msg('Porta occupata. Usa Scollega per liberarla.');return}if(!selected){selected=id;msg(p.label+' selezionata. Scegli il secondo capo.');render();return}if(selected===id){selected=null;msg('Selezione annullata.');render();return}let a=ports[selected];if(!a){selected=null;return}if(mode==='pfs'&&((a.group==='splitter')===(p.group==='splitter'))){msg('Collega un’uscita splitter a un adattatore o al parcheggio.');return}if((mode==='home'&&(a.group!==p.group))||(mode!=='home'&&a.group===p.group)){msg('Terminali incompatibili. Seleziona un capo opposto.');return}let color=mode==='fiber'||mode==='pta'||mode==='pte'? (a.group==='A'?a.color:p.color):mode==='home'&&p.group==='eth'?'#2563eb':cableColor;s.links.push({a:selected,b:id,color});selected=null;if(mode==='home')s.reg=false;msg('Collegamento inserito.');render()}
function inventory(){let d=$('inventory');d.replaceChildren();if(mode==='pose'){d.textContent='Sonda: '+s.route+'/4 tratti · Cavo: '+(s.laid?'posato':'non posato');return}if(!s.links.length){d.textContent='Nessun collegamento inserito.';return}for(let l of s.links){let b=document.createElement('button');b.textContent=l.a+' ↔ '+l.b+'  ×';b.title='Rimuovi collegamento';b.onclick=()=>{s.links=s.links.filter(x=>x!==l);if(mode==='home')s.reg=false;selected=null;msg('Collegamento rimosso.');render()};d.append(b)}}
function button(parent,label,fn,pressed){let b=document.createElement('button');b.textContent=label;b.onclick=fn;if(pressed!==undefined)b.setAttribute('aria-pressed',String(pressed));parent.append(b);return b}function controls(){let d=$('tools'),h=$('sceneTools');d.replaceChildren();h.replaceChildren();if(mode==='pfs'){let b=button(h,s.open?'Chiudi portellone':'Apri portellone',toggleDoor);b.disabled=doorBusy;}else if(mode==='fiber'||mode==='pta'||mode==='pte'){button(h,s.open?'Chiudi coperchio':'Apri coperchio',()=>{s.open=!s.open;selected=null;controls();render()});}if(mode==='pose'){button(d,'Verifica / libera percorso',()=>{s.cleared=true;msg('Percorso alternativo verificato (simulazione).');render()});button(d,'Tira cavo',()=>{if(s.route!==4){msg('Completa il passaggio della sonda.');return}s.laid=true;msg('Posa completata · 85 m.');render()});return}let row=document.createElement('div');row.className='row';d.append(row);for(let [k,t] of [['connect','Collega'],['remove','Scollega'],['probe','Misura']])button(row,t,()=>{tool=k;selected=null;controls();render()},tool===k);if(mode==='pte'){button(h,s.mount==='wall'?'Montaggio su palo':'Montaggio a parete',()=>{s.mount=s.mount==='wall'?'pole':'wall';controls();render()});if(s.open)button(h,s.tray?'Abbassa vassoi':'Solleva vassoi',()=>{s.tray=!s.tray;selected=null;controls();render()});}if(mode==='pfs'){button(h,s.context?'Solo armadio':'Contesto stradale',()=>{s.context=!s.context;controls();render()});if(s.context)button(h,s.cutaway?'Chiudi sezione terreno':'Mostra sottosuolo',()=>{s.cutaway=!s.cutaway;controls();render()});button(h,s.showExisting?'Nascondi cablaggi esistenti':'Mostra cablaggi esistenti',()=>{s.showExisting=!s.showExisting;controls();render()});button(h,'Vista frontale',()=>{$('yaw').value=yaw=0;$('pitch').value=pitch=0;render()});let legend=document.createElement('div');legend.className='pfslegend';legend.innerHTML=names.map((n,i)=>`<span><i style="background:${colors[i]}"></i>${i+1} ${n}</span>`).join('');d.append(legend);let sw=document.createElement('div');sw.className='row';d.append(sw);for(let c of ['#eab308','#2563eb','#f8fafc']){let b=button(sw,'',()=>{cableColor=c;controls()},c===cableColor);b.className='swatch';b.style.background=c;b.title='Colore cavetto '+c;b.setAttribute('aria-label',b.title)}}if(mode==='home'){button(d,s.power?'Spegni apparati':'Alimenta apparati',()=>{s.power=!s.power;if(!s.power)s.reg=false;controls();render()});button(d,'Registra ONT',()=>{s.reg=s.power&&has('B','O');msg(s.reg?'ONT registrato (DEMO).':'LOS / alimentazione assente.');render()})}button(d,'Rimuovi tutti i cavi',()=>{s.links=[];s.reg=false;selected=null;render()});}
function ticket(){let t=mode==='pfs'?`OL DEMO-001\nSplitter ${s.targetA.replace(/^S/,'S0')}\nDestinazione ${s.targetB}\nColonna: ${names[+s.targetB.split('C')[1]-1]}\nPermuta SC/APC`:mode==='fiber'?'Cavo 12 FO\nGiunta i colori corrispondenti.':mode==='pta'?`PTA / derivazione\nFibra ${s.target+1} · ${names[s.target]}\nIngresso → uscita`:mode==='pte'?`PTE 24 FO · DEMO\nTubetto ${s.tube===0?'rosso':'verde'} (12 FO)\nFibra ${s.target+1} · ${names[s.target]}\nGiunta al pigtail della porta ${s.tube*12+s.target+1}.`:mode==='pose'?'Posa monofibra\nP1 → P2 → P3 → P4 → PTE\nPassa la sonda e tira il cavo.':'Attivazione FTTH\nBorchia → ONT → WAN\nLAN → PC\nAlimenta e registra ONT.';$('ticket').textContent=t}
function check(){let ok=false,t='';if(mode==='pfs'){ok=has(s.targetA,s.targetB);t=ok?'Permutazione corretta.':'Verifica splitter, porta e riga/colonna.'}if(mode==='fiber'){let n=0;for(let i=0;i<12;i++)if(has('A'+i,'B'+i))n++;ok=n===12;t=`${n}/12 corrette · ${s.links.length-n} errate · ${12-s.links.length} mancanti.`}if(mode==='pta'){ok=has('A'+s.target,'B'+s.target);t=ok?'Continuità corretta.':'Verifica la fibra di derivazione.'}if(mode==='pte'){let i=s.tube*12+s.target;ok=has('A'+i,'B'+i);t=ok?'Continuità PTE corretta (simulata).':'Verifica tubetto, colore e porta del pigtail.'}if(mode==='pose'){ok=s.route===4&&s.laid;t=ok?'Posa completata · 85 m.':'Percorso o tiro incompleto.'}if(mode==='home'){ok=s.power&&s.reg&&has('B','O')&&has('E','W')&&has('L','PC');t=ok?'PING OK · servizio simulato attivo.':'Verifica cablaggio, alimentazione e PON.'}$('result').className=ok?'ok':'ko';$('result').textContent=t;msg(t)}
function change(id){doorRun++;doorBusy=false;if(states.pfs)states.pfs.doorAngle=states.pfs.open?145:0;mode=id;s=states[id]||(states[id]=init(id));selected=null;tool='connect';notice='';$('title').textContent=tabs.find(x=>x[0]===id)[1];$('result').textContent='';for(let b of $('tabs').children)b.setAttribute('aria-pressed',String(b.dataset.mode===id));controls();ticket();render();try{history.replaceState(null,'','#'+id)}catch(e){}}for(let [id,t] of tabs){let b=button($('tabs'),t,()=>change(id));b.dataset.mode=id}for(let k of ['yaw','pitch','zoom'])$(k).oninput=()=>{yaw=+$('yaw').value;pitch=+$('pitch').value;zoom=+$('zoom').value/100;render()};$('viewReset').onclick=()=>{$('yaw').value=yaw=-12;$('pitch').value=pitch=9;$('zoom').value=100;zoom=1;render()};$('check').onclick=check;$('new').onclick=()=>{states[mode]=init(mode);change(mode)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;render()}});change(tabs.some(t=>t[0]===location.hash.slice(1))?location.hash.slice(1):'pfs');
