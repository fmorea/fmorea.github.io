 if(hover){const n=net(hover);overlay+=holes.filter(h=>net(h)===n).map(h=>circle(...coords[h],6,'#93b05580')).join('')}
 let body=[...parts.filter(p=>p.t==='wire'),...parts.filter(p=>p.t!=='wire')].map(p=>shape(pos&&p.id===active?{...p,p:pos}:p)).join('');
 if(Object.prototype.hasOwnProperty.call(terminals,tool)&&(draft.length||hover)){const hs=[...draft,...(hover?[hover]:[])];overlay+=hs.map(h=>circle(...coords[h],7,'#df7f22')).join('');if(hs.length>=2)body+=shape({id:'',t:tool,p:hs,bands:resistorBands.slice()},true)}
 if(tool==='probe')probes.forEach((h,i)=>{const [x,y]=coords[h];body+=circle(x,y,8,'none','stroke="'+(i?'#253743':'#bd382e')+'" stroke-width="3"')+label(x+11,y-10,i?'B':'A',14)});
 $('overlay').innerHTML=overlay;$('objects').innerHTML=body;
 $('status').textContent=notice||(wiring!==null?'Tocca un foro libero per collegare il morsetto '+(wiring===0?'Va.':'Vb.'):tool==='probe'?(probes.length===1?'Tocca il foro B per misurare V(A) − V(B).':'Tocca il foro A per iniziare una misura di tensione.'):tool==='select'?'Seleziona un componente. Trascina il corpo per spostarlo o un terminale selezionato per ricollegarlo.':tool==='wire'&&draft.length?'Cavo da '+draft[0]+' · Tocca un altro foro oppure il morsetto Va o Vb dell’alimentatore.':names[tool]+' · '+terminals[tool][draft.length]+' — scegli un foro libero. Inserimento continuo · Esc per selezionare.')+(hover?'   ·   '+hover+(voltages&&Number.isFinite(voltages(hover))?' · '+fmt(voltages(hover))+' V':''):'');
}
function inventory(){
 const box=$('inventory');box.textContent='';
 if(!parts.length){box.textContent='La scheda è vuota.';return}
 for(const p of parts){const b=document.createElement('button'),v=document.createElement('span');b.textContent=p.id;
 v.textContent=p.t==='resistor'?fmt(resistance(p.bands))+' Ω':names[p.t];b.append(v);b.setAttribute('aria-pressed',String(p.id===active));
 b.onclick=()=>{wiring=null;tool='select';active=p.id;draft=[];hover='';notice='';refresh()};box.append(b)}
}
function displaySupply(){
 const ok=!!voltages,ind=ok?regime:'ERR',screen=ok?fmt(actualV)+' V    '+fmt(actualI*1000)+' mA':'— V    — mA';
 $('instrument').innerHTML='<rect x="14" y="-78" width="352" height="72" rx="8" fill="#334155"/><rect x="133" y="-70" width="223" height="55" rx="4" fill="#102826"/>'+label(245,-51,'DC OUTPUT  ·  '+ind,13,'#8de0b8')+label(245,-26,screen,19,'#c6ffdb')+
 leads.map((h,i)=>{
 const x=i?106:70,color=i?'#293441':'#bd302b',sign=i?'Vb':'Va';
 let cable='';if(h){const [u,y]=coords[h];cable=line(x,-25,u,y,color,4)+circle(u,y,5,color)}
 const btn=$(i?'minusLead':'plusLead');btn.textContent=sign+' '+(i?'Nero':'Rosso')+' · '+(h||'libero');btn.setAttribute('aria-pressed',String(wiring===i));
 return cable+'<g data-lead="'+i+'" style="pointer-events:all;cursor:pointer">'+circle(x,-25,18,'transparent')+circle(x,-25,13,color)+label(x,-21,sign,12,'white')+'</g>'
 }).join('');
 $('power').textContent=powered?'Uscita ON':'Uscita OFF';$('power').setAttribute('aria-pressed',String(powered))
}
function refresh(){recalc();displaySupply();paint();inventory();for(const b of $('tools').children)b.setAttribute('aria-pressed',String(b.dataset.tool===tool));$('undo').disabled=!hist.length;$('redo').disabled=!future.length;
 const selected=part(),p=selected||(tool==='resistor'?{t:'resistor',bands:resistorBands}:null);panel.textContent='';const title=document.createElement('h2');panel.append(title);
 if(wiring!==null){title.textContent=wiring===0?'Morsetto Va':'Morsetto Vb';panel.append('Scegli un foro libero sulla breadboard. ');
 if(leads[wiring]){const btn=document.createElement('button');btn.textContent='Scollega cavo';btn.onclick=()=>{checkpoint();leads[wiring]=null;setTool('select')};panel.append(btn)}return}
 if(tool==='probe'){
 title.textContent='Voltmetro DC';const [a,b]=probes;
 const ready=b&&voltages&&Number.isFinite(voltages(a))&&Number.isFinite(voltages(b));
 const out=document.createElement('p');out.className='readout';out.textContent=ready?fmt(voltages(a)-voltages(b))+' V':b?'Misura indisponibile':'— V';
 panel.append(out,'A (+) '+(a||'…')+'   /   B (−) '+(b||'…'));return}
 title.textContent=selected?p.id+' · '+names[p.t]:tool==='select'?'Banco di montaggio':names[tool];
 if(!p){panel.append(tool==='select'?'Scegli uno strumento per iniziare il montaggio.':'Indica sulla breadboard, in ordine: '+terminals[tool].join(' → ')+'. Il componente viene inserito all’ultimo clic.');return}
 if(p.t==='resistor'){const sample=document.createElement('div');sample.className='component-preview';
 for(const band of p.bands){const stripe=document.createElement('i');stripe.style.backgroundColor=palette[band];sample.append(stripe)}panel.append(sample);
 for(let k=0;k<4;k++){const l=document.createElement('label'),s=document.createElement('select');l.className='band';l.append(['Prima cifra','Seconda cifra','Moltiplicatore','Tolleranza'][k],s);panel.append(l);labels.forEach((n,i)=>{if(k===0&&(i===0||i>9)||k===1&&i>9||k===3&&!(i in toler))return;s.add(new Option(n,i))});s.value=p.bands[k];s.style.borderBottom='5px solid '+palette[p.bands[k]];s.onchange=()=>{if(selected)checkpoint();p.bands[k]=+s.value;resistorBands=p.bands.slice();refresh();panel.querySelectorAll('select')[k].focus()}}
 const r=resistance(p.bands),t=toler[p.bands[3]],out=document.createElement('p');out.textContent=fmt(r)+' Ω ±'+fmt(t)+'% · '+fmt(r*(1-t/100))+' – '+fmt(r*(1+t/100))+' Ω';panel.append(out)}
 if(!selected){panel.append('Scegli i due fori per montare questa resistenza.');return}
 const read=document.createElement('p');read.className='readout';read.textContent=p.p.map((h,i)=>terminals[p.t][i]+' '+h+(voltages?' · '+fmt(voltages(h))+' V':'')).join('\n')+(voltages&&currents.has(p.id)?'   /   '+fmt(currents.get(p.id)*1000)+' mA':'');panel.append(read);
 function action(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;panel.append(b)}
 if(p.t==='button')action(p.on?'Apri interruttore':'Chiudi interruttore',()=>{checkpoint();p.on=!p.on;refresh()});
 action('Elimina componente',erase)
}
function erase(){if(!part())return;checkpoint();parts=parts.filter(p=>p.id!==active);active='';refresh()}
function point(e){const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(svg.getScreenCTM().inverse())}
function nearest(q){
 if(tool==='wire'||wiring!==null){
  for(const rail of ['TV','TG','BV','BG']){
   const [start,y]=coords[rail+'1'],end=coords[rail+'30'][0];
   if(Math.abs(q.y-y-9)<=5&&q.x>=52&&q.x<=1130)
    return rail+Math.max(1,Math.min(30,1+Math.round((q.x-start)*29/(end-start))));
  }
 }
 let best='',dist=19;for(const [h,[x,y]] of Object.entries(coords)){const d=Math.hypot(q.x-x,q.y-y);if(d<dist){best=h;dist=d}}return best}
function free(h,ignore){return !leads.includes(h)&&!parts.some(p=>p.id!==ignore&&p.p.includes(h))}
function place(h){if(!h)return;if(!free(h)||draft.includes(h)){notice='Foro occupato. Scegli un foro libero.';paint();return}notice='';draft.push(h);if(draft.length===terminals[tool].length){checkpoint();const prefix={wire:'W',led:'LED',button:'S',transistor:'Q',resistor:'R'}[tool];let i=1;while(parts.some(p=>p.id===prefix+i))i++;active=prefix+i;parts.push({id:active,t:tool,p:draft,bands:resistorBands.slice(),on:false});draft=[];hover='';refresh()}else paint()}
function moved(q){const p=part();if(drag.pin!==null){const h=nearest(q);if(!h)return null;return p.p.map((v,i)=>i===drag.pin?h:v)}
 const [sx,sy]=coords[p.p[0]],target=nearest({x:sx+q.x-drag.start.x,y:sy+q.y-drag.start.y});if(!target)return null;
 const idx=h=>holes.indexOf(h),dx=idx(target)%30-idx(p.p[0])%30,dy=Math.floor(idx(target)/30)-Math.floor(idx(p.p[0])/30);
 return p.p.map(h=>{const i=idx(h),col=i%30+dx,row=Math.floor(i/30)+dy;return col>=0&&col<30&&row>=0&&row<rows.length?rows[row]+(col+1):null})}
let tap=null,moveTouch=false;
$('moveTouch').onclick=()=>{moveTouch=!moveTouch;setTool('select');svg.classList.toggle('move-touch',moveTouch);$('moveTouch').setAttribute('aria-pressed',String(moveTouch))};
function chooseLead(i){
 if(tool==='wire'&&draft.length===1){
  const h=draft[0];
  checkpoint();leads[i]=h;draft=[];hover='';active='';notice='Morsetto '+(i?'Vb':'Va')+' collegato a '+h+'. Scegli il primo foro del prossimo cavo.';refresh();return;
 }
 setTool('select');moveTouch=false;svg.classList.remove('move-touch');$('moveTouch').setAttribute('aria-pressed','false');wiring=i;refresh()}
$('plusLead').onclick=()=>chooseLead(0);$('minusLead').onclick=()=>chooseLead(1);
function activate(e,allowDrag){const q=point(e);
 const socket=e.target.closest('[data-lead]');if(socket){chooseLead(Number(socket.dataset.lead));return}
 if(wiring!==null){const h=nearest(q);if(!h)return;if(leads[wiring]!==h&&!free(h)){notice='Foro occupato. Scegli un foro libero.';paint();return}checkpoint();leads[wiring]=h;setTool('select');return}
if(tool==='probe'){const h=nearest(q);if(h){if(probes.length===2)probes=[];probes.push(h);refresh()}return}
 if(tool!=='select'){hover='';place(nearest(q));return}const hit=e.target.closest('[data-id]');active=hit?.dataset.id||'';notice='';if(active&&allowDrag){drag={start:q,pin:e.target.hasAttribute('data-pin')?Number(e.target.dataset.pin):null,candidate:null};svg.setPointerCapture(e.pointerId)}refresh()};
svg.onpointerdown=e=>{if(e.button!==0)return;if(e.pointerType==='touch'&&!(moveTouch&&tool==='select')){tap=e.isPrimary===false?null:{x:e.clientX,y:e.clientY,id:e.pointerId};return}activate(e,true)};
svg.onpointermove=e=>{if(e.pointerType==='touch'&&!drag){if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>7)tap=null;return}const q=point(e),h=nearest(q);if(!drag&&hover===h)return;hover=h;if(drag){const a=moved(q);drag.candidate=a&&a.every(h=>h&&free(h,active))&&new Set(a).size===a.length?a:null;notice=drag.candidate?'Rilascia per posizionare.':'Posizione non disponibile.'}paint()};
svg.onpointerup=e=>{if(tap&&tap.id===e.pointerId){const isTap=Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<=7;tap=null;if(isTap)activate(e,false);return}if(!drag)return;const p=part(),a=drag.candidate;if(a&&a.some((h,i)=>h!==p.p[i])){checkpoint();p.p=a}drag=null;notice='';refresh()};
svg.onpointercancel=()=>{tap=null;drag=null;notice='';paint()};svg.onpointerleave=()=>{hover='';paint()};
const symbols={probe:'M3 16l8-8 4 4-8 8m6-11 7-7',select:'M5 2v14l4-4 4 6 3-2-4-6h6z',wire:'M2 15h6l8-10h6',resistor:'M1 10h5V6h12v8H6v-4m12 0h5',led:'M1 11h6V5l9 6-9 6v-6m9-7v14m0-7h7m-8-7 4-3m0 5 4-3',button:'M1 14h5l11-9m1 9h5',transistor:'M2 10h7m0-7v14m0-8 10-6V1M9 12l10 5v2m-5-3 5 1-2-4'};
for(const [t,name] of Object.entries({select:'Seleziona',...names,probe:'Voltmetro'})){const b=document.createElement('button');b.dataset.tool=t;b.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 20"><path d="'+symbols[t]+'" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';b.append(name);b.onclick=()=>setTool(t);$('tools').append(b)}
$('preset').onchange=e=>{checkpoint();parts=e.target.value==='xor'?JSON.parse(JSON.stringify(demo)):[];leads=e.target.value==='xor'?['TV1','TG1']:[null,null];e.target.value='';setTool('select')};
$('undo').onclick=()=>restore(hist,future);$('redo').onclick=()=>restore(future,hist);$('supply').oninput=refresh;$('power').onclick=()=>{checkpoint();powered=!powered;refresh()};
$('zoom').onchange=e=>{svg.style.width=(100*Number(e.target.value))+'%';svg.style.minWidth=(740*Number(e.target.value))+'px'};
$('export').onclick=()=>{
 const supply=$('supply').valueAsNumber;if(!Number.isFinite(supply)||supply<0||supply>24){$('error').textContent='Correggi la tensione prima di salvare.';return}
 const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,supply,powered,parts,leads},null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download='circuito-breadboard.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
};
function readProject(text){
 const data=JSON.parse(text),used=new Set(),ids=new Set();
 if(data?.version!==1||!Number.isFinite(data.supply)||data.supply<0||data.supply>24||!Array.isArray(data.parts)||data.parts.length>holes.length/2)throw Error();
 if(data.powered!==undefined&&typeof data.powered!=='boolean')throw Error();
 for(const p of data.parts){
 if(!p||!Object.prototype.hasOwnProperty.call(terminals,p.t)||typeof p.id!=='string'||!/^\w{1,48}$/.test(p.id)||ids.has(p.id)||!Array.isArray(p.p)||p.p.length!==terminals[p.t].length)throw Error();
 ids.add(p.id);for(const h of p.p){if(!holes.includes(h)||used.has(h))throw Error();used.add(h)}
 if(typeof p.on!=='boolean')throw Error();
 if(p.t==='resistor'&&(!Array.isArray(p.bands)||p.bands.length!==4||!p.bands.every(Number.isInteger)||p.bands[0]<1||p.bands[0]>9||p.bands[1]<0||p.bands[1]>9||p.bands[2]<0||p.bands[2]>11||!Object.prototype.hasOwnProperty.call(toler,p.bands[3])))throw Error()
 }
 if(data.leads===undefined){data.leads=['TV','TG'].map(r=>holes.find(h=>h.startsWith(r)&&!used.has(h))||r+'1')}
 else {if(!Array.isArray(data.leads)||data.leads.length!==2)throw Error();for(const h of data.leads){if(h===null)continue;if(!holes.includes(h)||used.has(h))throw Error();used.add(h)}}
 return data
}
$('open').onclick=()=>$('file').click();
$('file').onchange=async e=>{const input=e.target;try{if(!input.files.length)return;const f=input.files[0];if(f.size>200000)throw Error();const d=readProject(await f.text());checkpoint();parts=d.parts;leads=d.leads;$('supply').value=d.supply;powered=d.powered??true;setTool('select')}catch{$('error').textContent='Progetto non valido. Controlla il file JSON.'}finally{input.value=''}};
$('substrate').innerHTML=base;
document.onkeydown=e=>{if(e.key==='Escape'){setTool('select');return}if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='Delete')erase();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?restore(future,hist):restore(hist,future)}};
refresh();
